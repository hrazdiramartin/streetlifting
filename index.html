<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#15110f">
  <title>Streetlifting — Přehled</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar"></header>

    <main class="main">
      <div class="page-header">
        <span class="eyebrow" id="today-eyebrow">Načítám…</span>
        <h1 id="greeting">Vítej zpět</h1>
      </div>

      <!-- Aktuální týden — 3 tréninky -->
      <section class="mb-6" id="current-week-section"></section>

      <!-- Stats grid -->
      <div class="grid grid-2 mb-6" id="stats-grid"></div>

      <!-- Recent completed + Body weight chart -->
      <div class="grid grid-2 mb-6">
        <section class="card">
          <div class="card-header">
            <span class="card-title">Poslední odtrénované</span>
            <a href="plan.html" class="text-muted" style="font-size: 0.8rem;">Plán →</a>
          </div>
          <div id="recent-workouts"></div>
        </section>

        <section class="card">
          <div class="card-header">
            <span class="card-title">Tělesná váha (30 dní)</span>
            <a href="profile.html" class="text-muted" style="font-size: 0.8rem;">Detail →</a>
          </div>
          <div class="chart-container" style="height: 220px;">
            <canvas id="weight-mini-chart"></canvas>
          </div>
        </section>
      </div>

      <!-- Quick log buttons -->
      <section class="card mb-6">
        <div class="card-header">
          <span class="card-title">Rychlé akce</span>
        </div>
        <button class="btn btn-primary btn-block" id="btn-log-weight">Záznam váhy</button>
      </section>
    </main>

    <nav class="bottomnav" id="bottomnav"></nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cloud-sync.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
