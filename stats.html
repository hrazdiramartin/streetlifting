<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#15110f">
  <title>Streetlifting — Statistiky</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar"></header>

    <main class="main">
      <div class="page-header flex-between" style="flex-direction: row; align-items: flex-end; flex-wrap: wrap; gap: var(--space-3);">
        <div>
          <span class="eyebrow">Dlouhodobé výsledky</span>
          <h1>Statistiky</h1>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-ghost btn-sm range-btn active" data-range="90">3M</button>
          <button class="btn btn-ghost btn-sm range-btn" data-range="180">6M</button>
          <button class="btn btn-ghost btn-sm range-btn" data-range="365">1R</button>
          <button class="btn btn-ghost btn-sm range-btn" data-range="all">Vše</button>
        </div>
      </div>

      <!-- PR Grid: 1RM-10RM pro 4 hlavní cviky (manuální editace) -->
      <h3 class="mb-3" style="color: var(--text-muted); font-size: 1rem;">Osobní rekordy (1RM – 10RM)</h3>
      <div class="prs-grid-container mb-6" id="prs-grid-container"></div>

      <!-- Main exercise progress charts (z PR dat) -->
      <h3 class="mb-3" style="color: var(--text-muted); font-size: 1rem;">Progres hlavních cviků (1RM v čase)</h3>
      <div class="grid grid-2 mb-6" id="main-exercise-charts"></div>

      <!-- Body weight chart -->
      <section class="card mb-6">
        <div class="card-header">
          <span class="card-title">Tělesná váha</span>
          <span class="text-muted" style="font-size: 0.8rem;" id="weight-summary"></span>
        </div>
        <div class="chart-container tall">
          <canvas id="weight-chart"></canvas>
        </div>
      </section>

      <!-- Heatmap consistency -->
      <section class="card mb-6">
        <div class="card-header">
          <span class="card-title">Konzistence (poslední rok)</span>
          <span class="text-muted" style="font-size: 0.8rem;" id="heatmap-summary"></span>
        </div>
        <div id="heatmap-container" style="overflow-x: auto;"></div>
      </section>
    </main>

    <nav class="bottomnav" id="bottomnav"></nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cloud-sync.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/stats.js"></script>
</body>
</html>
