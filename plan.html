<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#15110f">
  <title>Streetlifting — Plán</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar"></header>

    <main class="main">
      <div class="page-header flex-between" style="flex-direction: row; align-items: flex-end;">
        <div>
          <span class="eyebrow">Tréninkový plán</span>
          <h1>Bloky a týdny</h1>
        </div>
        <button class="btn btn-primary" id="btn-new-block">+ Nový blok</button>
      </div>

      <!-- Current block highlight -->
      <div id="current-block-section"></div>

      <!-- All blocks list -->
      <h3 class="mt-6 mb-3" style="color: var(--text-muted); font-size: 1rem;">Všechny bloky</h3>
      <div id="blocks-list" class="grid grid-2"></div>
    </main>

    <nav class="bottomnav" id="bottomnav"></nav>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cloud-sync.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/plan.js"></script>
</body>
</html>
